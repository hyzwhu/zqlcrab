[package]
name = "zqlcrab"
version = "0.1.4"
edition = "2024"
description = "A modern, high-performance database IDE built with Rust & GPUI"
authors = ["zqlcrab contributors"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/hyzwhu/zqlcrab"
homepage = "https://github.com/hyzwhu/zqlcrab"
keywords = ["database", "sql", "sqlite", "postgres", "mysql"]
categories = ["development-tools", "database-utilities", "gui"]

[dependencies]
gpui-kit = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
mysql_async = { version = "0.34", default-features = false, features = ["minimal-rust", "rustls-tls", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
sqlformat = "0.2"
lsp-types = { version = "0.97.0", features = ["proposed"] }
mimalloc = { version = "0.1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
csv = "1.3"
encoding_rs = "0.8"
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"


