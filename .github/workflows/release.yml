name: Release

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: zqlcrab
            asset_name: zqlcrab-aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: zqlcrab
            asset_name: zqlcrab-x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: zqlcrab
            asset_name: zqlcrab-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: zqlcrab
            asset_name: zqlcrab-aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: zqlcrab.exe
            asset_name: zqlcrab-x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: zqlcrab.exe
            asset_name: zqlcrab-aarch64-pc-windows-msvc

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libvulkan1

      - name: Install macOS packaging tools
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg-pack/zqlcrab.app/Contents/{MacOS,Resources}
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dmg-pack/zqlcrab.app/Contents/MacOS/
          cp assets/icon.icns dmg-pack/zqlcrab.app/Contents/Resources/AppIcon.icns
          cp assets/Info.plist dmg-pack/zqlcrab.app/Contents/Info.plist
          cp "assets/复制修复命令.txt" dmg-pack/
          chmod +x dmg-pack/zqlcrab.app/Contents/MacOS/${{ matrix.artifact_name }}

          create-dmg \
            --volname "zqlcrab Installer" \
            --window-pos 200 120 \
            --window-size 800 480 \
            --icon-size 75 \
            --icon "zqlcrab.app" 190 145 \
            --hide-extension "zqlcrab.app" \
            --app-drop-link 610 145 \
            --icon "复制修复命令.txt" 668 354 \
            --hide-extension "复制修复命令.txt" \
            --background "assets/dmg-background.png" \
            "${{ matrix.asset_name }}.dmg" \
            "dmg-pack/" || test -f "${{ matrix.asset_name }}.dmg"
          shasum -a 256 ${{ matrix.asset_name }}.dmg > ${{ matrix.asset_name }}.dmg.sha256

          mkdir -p release-pack
          cp -r dmg-pack/zqlcrab.app release-pack/
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} release-pack/
          cp README.md README_zh.md LICENSE-APACHE release-pack/
          tar -czvf ${{ matrix.asset_name }}.tar.gz -C release-pack .
          shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Package release artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-pack
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} release-pack/
          cp README.md README_zh.md LICENSE-APACHE release-pack/
          tar -czvf ${{ matrix.asset_name }}.tar.gz -C release-pack .
          shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Package release artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p release-pack
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} release-pack/
          cp assets/icon.ico release-pack/
          cp README.md README_zh.md LICENSE-APACHE release-pack/
          7z a ${{ matrix.asset_name }}.zip ./release-pack/*
          certutil -hashfile ${{ matrix.asset_name }}.zip SHA256 | findstr -v "hash" | findstr -v "CertUtil" > ${{ matrix.asset_name }}.zip.sha256

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "zqlcrab ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: |
            ${{ matrix.asset_name }}.*
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          generate_release_notes: false
